[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automation-miner"
version = "0.1.0"
description = "Structured domain analysis and automation discovery engine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ghassan Alhamoud" }]
requires-python = ">=3.12"
keywords = ["automation", "discovery", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langgraph",
    "pydantic>=2",
    "pyyaml",
    "httpx",
]

[project.urls]
Homepage = "https://ghassan-alhamoud.com"
Repository = "https://github.com/ghassan-ai-projects/automation-miner"
Issues = "https://github.com/ghassan-ai-projects/automation-miner/issues"

[project.optional-dependencies]
mcp = ["mcp"]
# Document readers. Each format is independently installable so a run only
# pays for the parsers it needs; missing ones are reported, never silent.
pdf = ["pypdf>=4"]
docx = ["python-docx>=1"]
xlsx = ["openpyxl>=3"]
pptx = ["python-pptx>=1"]
readers = ["pypdf>=4", "python-docx>=1", "openpyxl>=3", "python-pptx>=1"]
all = ["mcp", "pypdf>=4", "python-docx>=1", "openpyxl>=3", "python-pptx>=1"]

[project.scripts]
automation-miner = "automation_miner.cli.main:main"
automation-miner-mcp = "automation_miner.mcp.server:main"

[dependency-groups]
dev = ["pytest", "ruff", "pypdf>=4", "python-docx>=1", "openpyxl>=3", "python-pptx>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/automation_miner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

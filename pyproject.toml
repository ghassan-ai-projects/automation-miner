[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automation-miner"
version = "0.1.0"
description = "Structured domain analysis and automation discovery engine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ghassan Alhamoud" }]
requires-python = ">=3.12"
keywords = ["automation", "discovery", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langgraph>=1.2,<2",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://ghassan-alhamoud.com"
Repository = "https://github.com/ghassan-ai-projects/automation-miner"
Issues = "https://github.com/ghassan-ai-projects/automation-miner/issues"

[project.optional-dependencies]
mcp = ["mcp"]
# Document readers. Each format is independently installable so a run only
# pays for the parsers it needs; missing ones are reported, never silent.
pdf = ["pypdf>=4"]
docx = ["python-docx>=1"]
xlsx = ["openpyxl>=3"]
pptx = ["python-pptx>=1"]
readers = ["pypdf>=4", "python-docx>=1", "openpyxl>=3", "python-pptx>=1"]
all = ["mcp", "pypdf>=4", "python-docx>=1", "openpyxl>=3", "python-pptx>=1"]

[project.scripts]
automation-miner = "automation_miner.cli.main:main"
automation-miner-mcp = "automation_miner.mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "types-PyYAML>=6,<7",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "pypdf>=4",
    "python-docx>=1",
    "openpyxl>=3",
    "python-pptx>=1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/automation_miner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/automation_miner"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# LangGraph transports untyped values at the graph boundary. The boundary is
# explicit in graph/build.py; the shared MinerState and execution context stay
# typed so dynamic provider payloads do not spread through the package.
[[tool.mypy.overrides]]
module = ["automation_miner.graph.build", "automation_miner.models.client"]
disallow_untyped_defs = false

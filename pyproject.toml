[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automation-miner"
version = "0.1.0"
description = "Structured domain analysis and automation discovery engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "pydantic>=2",
    "pyyaml",
    "httpx",
]

[project.optional-dependencies]
mcp = ["mcp"]

[project.scripts]
automation-miner = "automation_miner.cli.main:main"
automation-miner-mcp = "automation_miner.mcp.server:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/automation_miner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
